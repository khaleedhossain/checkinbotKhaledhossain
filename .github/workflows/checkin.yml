name: Scheduled Check-In Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "0 15 * * *"

permissions:
  contents: write

jobs:
  run-checkin-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run check-in bot
        env:
          PRACTICE_API_TOKEN: ${{ secrets.PRACTICE_API_TOKEN }}
          PRACTICE_API_URL: ${{ vars.PRACTICE_API_URL }}
          INSTRUCTOR_ID: ${{ vars.INSTRUCTOR_ID }}
        run: python checkin_bot.py

      - name: Commit artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifact/
          git diff --cached --quiet || git commit -m "Update check-in artifacts"
          git push
